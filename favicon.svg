<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Bridge Arc -->
  <path d="M 8 42 Q 32 18 56 42" stroke="url(#bridgeGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Commute Car -->
  <path d="M 18 36 C 18 33, 24 26, 32 26 C 40 26, 46 33, 46 36 L 50 36 C 51.5 36, 52 37, 52 39 L 52 44 C 52 45, 51.5 45.5, 51 45.5 L 49 45.5 C 49 43.5, 47 42, 45 42 C 43 42, 41 43.5, 41 45.5 L 23 45.5 C 23 43.5, 21 42, 19 42 C 17 42, 15 43.5, 15 45.5 L 13 45.5 C 12.5 45.5, 12 45, 12 44 L 12 39 C 12 37, 12.5 36, 14 36 Z" fill="url(#carGrad)"/>
  
  <!-- Wheels -->
  <circle cx="19" cy="45.5" r="3.5" fill="#f8fafc"/>
  <circle cx="45" cy="45.5" r="3.5" fill="#f8fafc"/>
  <circle cx="19" cy="45.5" r="1.5" fill="#0f172a"/>
  <circle cx="45" cy="45.5" r="1.5" fill="#0f172a"/>
  
  <!-- Live Signal / Green Traffic Dot -->
  <circle cx="48" cy="18" r="4" fill="#10b981"/>
  <circle cx="48" cy="18" r="7" fill="#10b981" opacity="0.35"/>
</svg>
