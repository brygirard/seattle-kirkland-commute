name: 24/7 Commute Traffic Poller

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [poll_traffic]

jobs:
  poll-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Traffic Poller
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY || 'QuSopbXau96swtFznGbYJV74BYwuZAML' }}
        run: node .github/scripts/poll.js

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git status
          git diff-index --quiet HEAD || (git commit -m "auto: update commute traffic log [skip ci]" && git push)

      - name: Trigger Next Run (5-Minute Chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/brygirard/seattle-kirkland-commute/dispatches \
            -d '{"event_type": "poll_traffic"}'
